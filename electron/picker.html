<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 360px;
    height: 480px;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #fff;
  }

  .picker-panel {
    width: 100%;
    height: 100%;
    background: rgba(20, 20, 24, 0.94);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.55),
      0 2px 6px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .picker-header {
    padding: 12px 16px 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
    flex-shrink: 0;
  }

  /* Sticky Quick Inbox target — always the first, always-there destination. */
  .picker-inbox-row {
    margin: 0 10px 8px;
    padding: 12px 14px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(120, 210, 255, 0.18), rgba(120, 210, 255, 0.04));
    border: 1px solid rgba(120, 210, 255, 0.28);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.12s ease, transform 0.08s ease;
    flex-shrink: 0;
  }
  .picker-inbox-row:hover {
    background: linear-gradient(135deg, rgba(120, 210, 255, 0.24), rgba(120, 210, 255, 0.08));
  }
  .picker-inbox-row:active { transform: scale(0.985); }
  .picker-inbox-row.active {
    border-color: rgba(120, 210, 255, 0.6);
    box-shadow: 0 0 0 1px rgba(120, 210, 255, 0.4) inset;
  }
  .picker-inbox-icon { font-size: 18px; line-height: 1; }
  .picker-inbox-text {
    font-size: 13px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.95);
  }
  .picker-inbox-hint {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
    margin-left: auto;
  }

  .picker-grid-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px 10px;
  }
  .picker-grid-scroll::-webkit-scrollbar { width: 6px; }
  .picker-grid-scroll::-webkit-scrollbar-track { background: transparent; }
  .picker-grid-scroll::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 3px;
  }

  .picker-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  /* Mini "pinboard snapshot" cards — a glanceable mirror of the home canvas. */
  .picker-card {
    padding: 10px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    cursor: pointer;
    height: 92px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
  }
  .picker-card:hover {
    background: rgba(255, 255, 255, 0.09);
    border-color: rgba(255, 255, 255, 0.18);
  }
  .picker-card:active { transform: scale(0.985); }
  .picker-card.active {
    border-color: rgba(255, 255, 255, 0.35);
    background: rgba(255, 255, 255, 0.12);
  }
  .picker-card-title {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.95);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .picker-card-preview {
    font-size: 10px;
    color: rgba(255, 255, 255, 0.5);
    line-height: 1.3;
    flex: 1;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .picker-card-time {
    font-size: 9px;
    color: rgba(255, 255, 255, 0.35);
    margin-top: 4px;
  }

  .picker-new-row {
    margin: 8px 10px 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.12s ease;
  }
  .picker-new-row:hover { background: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.07)); }
  .picker-plus {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1;
  }

  .picker-empty {
    grid-column: 1 / -1;
    padding: 32px 16px;
    text-align: center;
    color: rgba(255, 255, 255, 0.45);
    font-size: 12px;
    font-style: italic;
  }
</style>
</head>
<body>
  <div class="picker-panel">
    <div class="picker-header">Save notes to</div>

    <div class="picker-inbox-row" id="inbox-row">
      <span class="picker-inbox-icon">📥</span>
      <span class="picker-inbox-text">Quick Inbox</span>
      <span class="picker-inbox-hint">always there</span>
    </div>

    <div class="picker-grid-scroll">
      <div class="picker-grid" id="grid">
        <div class="picker-empty">Loading…</div>
      </div>
    </div>

    <div class="picker-new-row" id="new-empty" title="Create an empty note now and open it for typing">
      <span class="picker-plus">+</span>
      <span>Create empty note</span>
    </div>
  </div>

<script>
  const gridEl = document.getElementById('grid');
  const inboxRow = document.getElementById('inbox-row');
  const newEmptyRow = document.getElementById('new-empty');

  function relTime(iso) {
    if (!iso) return '';
    const sec = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    if (sec < 60) return 'just now';
    const min = Math.round(sec / 60);
    if (min < 60) return min + 'm ago';
    const hr = Math.round(min / 60);
    if (hr < 24) return hr + 'h ago';
    const day = Math.round(hr / 24);
    if (day < 7) return day + 'd ago';
    return new Date(iso).toLocaleDateString();
  }

  function previewText(content) {
    if (!content) return '';
    // Strip markdown noise for a glanceable preview.
    return String(content)
      .replace(/[#*_>`~\[\]()]/g, '')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 100);
  }

  let inboxId = null;

  function renderCards(snapshot, activeId) {
    const notes = (snapshot && snapshot.notes) || [];
    inboxId = snapshot && snapshot.inbox ? snapshot.inbox.id : null;

    // Mark the Quick Inbox row active when it's the current target.
    inboxRow.classList.toggle('active', !!inboxId && activeId === inboxId);

    if (notes.length === 0) {
      gridEl.innerHTML = '<div class="picker-empty">No notes yet</div>';
      return;
    }
    gridEl.innerHTML = '';
    // Recent-first so the picker surfaces what the user most likely wants.
    const sorted = [...notes].sort((a, b) =>
      (b.updated_at || '').localeCompare(a.updated_at || '')
    );
    for (const n of sorted) {
      const card = document.createElement('div');
      card.className = 'picker-card' + (n.id === activeId ? ' active' : '');
      card.innerHTML =
        '<div class="picker-card-title"></div>' +
        '<div class="picker-card-preview"></div>' +
        '<div class="picker-card-time"></div>';
      card.querySelector('.picker-card-title').textContent = n.title || 'Untitled';
      card.querySelector('.picker-card-preview').textContent = previewText(n.content);
      card.querySelector('.picker-card-time').textContent = relTime(n.updated_at);
      card.addEventListener('click', () => window.pickerAPI.select(n.id));
      gridEl.appendChild(card);
    }
  }

  async function load() {
    const [snapshot, target] = await Promise.all([
      window.pickerAPI.getPickerSnapshot(),
      window.pickerAPI.getTarget(),
    ]);
    renderCards(snapshot, target && target.note_id);
  }

  inboxRow.addEventListener('click', () => {
    // Route to Quick Inbox = pin the routing target there.
    if (inboxId) window.pickerAPI.select(inboxId);
  });

  newEmptyRow.addEventListener('click', () => {
    window.pickerAPI.createEmptyNote();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.pickerAPI.close();
  });

  // Electron caches the page, so reload state each time the picker is shown.
  window.addEventListener('focus', load);
  load();
</script>
</body>
</html>
