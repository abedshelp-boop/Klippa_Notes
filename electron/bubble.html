<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 80px;
    height: 80px;
    overflow: hidden;
    background: transparent;
    user-select: none;
  }

  .bubble-container {
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ---- Core bubble circle ---- */
  .bubble {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #6c8cff;
    position: relative;
    z-index: 2;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                background 0.4s ease,
                box-shadow 0.4s ease;
    box-shadow: 0 0 14px rgba(108, 140, 255, 0.35),
                0 0 4px rgba(108, 140, 255, 0.2);
  }

  /* Klippa "K" letter */
  .bubble::after {
    content: 'K';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.9);
    transition: opacity 0.3s ease;
  }

  /* ---- Outer ring (used for processing spinner) ---- */
  .ring {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2.5px solid transparent;
    z-index: 1;
    transition: border-color 0.4s ease, opacity 0.4s ease;
    opacity: 0;
  }

  /* ---- Ripple element (used for command state) ---- */
  .ripple {
    position: absolute;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid rgba(108, 140, 255, 0.5);
    z-index: 1;
    opacity: 0;
    pointer-events: none;
  }

  /* =========================================
     STATE: listening (idle)
     Gentle breathing glow
     ========================================= */
  [data-status="listening"] .bubble {
    animation: breathe 3s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% {
      box-shadow: 0 0 14px rgba(108, 140, 255, 0.35),
                  0 0 4px rgba(108, 140, 255, 0.2);
    }
    50% {
      box-shadow: 0 0 22px rgba(108, 140, 255, 0.55),
                  0 0 8px rgba(108, 140, 255, 0.3);
    }
  }

  /* =========================================
     STATE: command (wake word detected)
     Bright pulse + ripple expansion + scale up
     ========================================= */
  [data-status="command"] .bubble {
    transform: scale(1.15);
    background: #8aa8ff;
    box-shadow: 0 0 28px rgba(108, 140, 255, 0.7),
                0 0 10px rgba(108, 140, 255, 0.4);
    animation: commandPulse 0.8s ease-in-out infinite;
  }

  [data-status="command"] .ripple {
    animation: rippleExpand 1.2s ease-out infinite;
  }

  @keyframes commandPulse {
    0%, 100% {
      box-shadow: 0 0 28px rgba(108, 140, 255, 0.7),
                  0 0 10px rgba(108, 140, 255, 0.4);
    }
    50% {
      box-shadow: 0 0 36px rgba(138, 168, 255, 0.85),
                  0 0 16px rgba(108, 140, 255, 0.5);
    }
  }

  @keyframes rippleExpand {
    0% {
      transform: scale(1);
      opacity: 0.6;
    }
    100% {
      transform: scale(1.7);
      opacity: 0;
    }
  }

  /* =========================================
     STATE: processing (generating note)
     Spinning ring + warm color shift
     ========================================= */
  [data-status="processing"] .bubble {
    background: linear-gradient(135deg, #6c8cff, #fbbf24);
    box-shadow: 0 0 20px rgba(251, 191, 36, 0.5),
                0 0 8px rgba(108, 140, 255, 0.3);
    animation: processingPulse 1.5s ease-in-out infinite;
  }

  [data-status="processing"] .bubble::after {
    opacity: 0.7;
  }

  [data-status="processing"] .ring {
    opacity: 1;
    border-color: transparent transparent #fbbf24 transparent;
    animation: spin 1s linear infinite;
  }

  @keyframes processingPulse {
    0%, 100% {
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.5),
                  0 0 8px rgba(108, 140, 255, 0.3);
    }
    50% {
      box-shadow: 0 0 28px rgba(251, 191, 36, 0.7),
                  0 0 12px rgba(108, 140, 255, 0.4);
    }
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* =========================================
     STATE: disconnected
     Dimmed, gray, no animation
     ========================================= */
  [data-status="disconnected"] .bubble {
    background: #555;
    box-shadow: 0 0 6px rgba(80, 80, 80, 0.3);
    animation: none;
  }

  [data-status="disconnected"] .bubble::after {
    opacity: 0.4;
  }
</style>
</head>
<body>
  <div class="bubble-container" id="container" data-status="disconnected">
    <div class="ring"></div>
    <div class="ripple"></div>
    <div class="bubble" id="bubble"></div>
  </div>

<script>
  const WS_URL = 'ws://localhost:8765/ws';
  const RECONNECT_DELAY = 3000;
  const DRAG_THRESHOLD = 4;

  const container = document.getElementById('container');
  const bubble = document.getElementById('bubble');

  let ws = null;
  let reconnectTimer = null;
  let audioCtx = null;
  let prevStatus = 'disconnected';

  function playTone(frequencies, duration = 0.08, gap = 0.02) {
    // #region agent log
    const preState = audioCtx ? audioCtx.state : 'not-created';
    // #endregion
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    // #region agent log
    fetch('http://127.0.0.1:7877/ingest/b58dc82e-754b-493e-931e-d738b6f38575',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'d0e376'},body:JSON.stringify({sessionId:'d0e376',location:'bubble.html:playTone',message:'playTone called',data:{frequencies,duration,gap,audioCtxStateBefore:preState,audioCtxStateAfter:audioCtx.state,sampleRate:audioCtx.sampleRate,currentTime:audioCtx.currentTime,destChannels:audioCtx.destination.maxChannelCount},timestamp:Date.now()})}).catch(()=>{});
    // #endregion
    let time = audioCtx.currentTime;
    frequencies.forEach(freq => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.15, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
      osc.start(time);
      osc.stop(time + duration + 0.01);
      time += duration + gap;
    });
  }

  // ---- WebSocket ----
  function connect() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

    try {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        setStatus('listening');
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'status') {
            setStatus(msg.status);
          }
        } catch {}
      };

      ws.onclose = () => {
        setStatus('disconnected');
        ws = null;
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, RECONNECT_DELAY);
      };

      ws.onerror = () => {
        ws.close();
      };
    } catch {
      setStatus('disconnected');
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, RECONNECT_DELAY);
    }
  }

  function setStatus(s) {
    // #region agent log
    const willPlay = (prevStatus === 'listening' && s === 'command') || (prevStatus === 'command' && s === 'processing') || (prevStatus === 'processing' && s === 'listening');
    fetch('http://127.0.0.1:7877/ingest/b58dc82e-754b-493e-931e-d738b6f38575',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'d0e376'},body:JSON.stringify({sessionId:'d0e376',location:'bubble.html:setStatus',message:'setStatus called',data:{prevStatus,newStatus:s,willPlaySound:willPlay},timestamp:Date.now()})}).catch(()=>{});
    // #endregion
    if (prevStatus === 'listening' && s === 'command') playTone([523, 659]);
    if (prevStatus === 'command' && s === 'processing') playTone([587], 0.12);
    if (prevStatus === 'processing' && s === 'listening') playTone([784, 659, 523]);
    prevStatus = s;
    container.setAttribute('data-status', s);
  }

  // ---- Drag + Click ----
  let isDragging = false;
  let dragStartX = 0;
  let dragStartY = 0;
  let hasMoved = false;

  bubble.addEventListener('mousedown', (e) => {
    if (e.button === 2) return; // right-click handled separately
    isDragging = true;
    hasMoved = false;
    dragStartX = e.screenX;
    dragStartY = e.screenY;
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;

    const dx = e.screenX - dragStartX;
    const dy = e.screenY - dragStartY;

    if (!hasMoved && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
      hasMoved = true;
    }

    if (hasMoved) {
      window.bubbleAPI?.moveBubble(dx, dy);
      dragStartX = e.screenX;
      dragStartY = e.screenY;
    }
  });

  document.addEventListener('mouseup', (e) => {
    if (!isDragging) return;
    isDragging = false;

    if (!hasMoved && e.button === 0) {
      window.bubbleAPI?.showMainWindow();
    }
  });

  // ---- Right-click context menu handled by Electron main process ----

  // ---- Start ----
  connect();
</script>
</body>
</html>
