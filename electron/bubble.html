<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  :root {
    --window-w: 260px;       /* Electron window width — sync with BUBBLE_WINDOW_W in main.js */
    --window-h: 140px;       /* Electron window height — sync with BUBBLE_WINDOW_H in main.js */
    --box: 48px;             /* visible box size — sync with BUBBLE_SIZE in main.js */
    --right-pad: 26px;       /* gap between box and right edge of window — sync with BUBBLE_RIGHT_PAD */
    --tooltip-gap: 10px;     /* gap between box and hover tooltip */

    /* Per-state accent colors — kept in CSS vars so the glow/border/dot can
       all reference the same tint and animations stay synchronized. */
    --accent-idle:      255, 255, 255;
    --accent-listening: 120, 210, 255;   /* cool cyan-white */
    --accent-noting:    255, 190,  90;   /* warm amber */
    --accent-failed:    255, 140, 110;   /* red-amber */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: var(--window-w);
    height: var(--window-h);
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  /* ── stage anchors the box to the right side of the window ── */
  #stage {
    position: absolute;
    right: var(--right-pad);
    top: 50%;
    transform: translateY(-50%);
    width: var(--box);
    height: var(--box);
    /* The CSS var --accent gets swapped per-phase below so all the tinted
       layers (glow, halo border, sweep) can derive from a single source. */
    --accent: var(--accent-idle);
  }
  #stage[data-phase="listening"] { --accent: var(--accent-listening); }
  #stage[data-phase="noting"]    { --accent: var(--accent-noting); }

  /* ── halo rings (outside the box, used for listening/noting pulses) ── */
  .halo-ring {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: 14px;
    border: 1px solid rgba(var(--accent), 0.65);
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 0 12px rgba(var(--accent), 0.30);
  }
  #stage[data-phase="listening"] .halo-ring {
    animation: pulseRing 2.0s cubic-bezier(0.22, 1, 0.36, 1) infinite;
  }
  #stage[data-phase="noting"] .halo-ring {
    animation: pulseRing 1.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
  }

  /* ── outer glow — pulses around the box, tinted per phase.
        Implemented as a sibling layer (not box-shadow on .box) so it can
        breathe in opacity/scale without forcing repaints on the box itself. */
  .glow {
    position: absolute;
    inset: -22px;
    border-radius: 28px;
    pointer-events: none;
    background: radial-gradient(
      closest-side,
      rgba(var(--accent), 0.35) 0%,
      rgba(var(--accent), 0.18) 35%,
      rgba(var(--accent), 0) 75%
    );
    opacity: 0;
    transition: opacity 0.35s ease;
    will-change: opacity, transform;
  }
  #stage[data-phase="idle"] .glow {
    animation: glowBreathe 4.0s ease-in-out infinite;
  }
  #stage[data-phase="listening"] .glow {
    animation: glowPulseListening 1.4s ease-in-out infinite;
  }
  #stage[data-phase="noting"] .glow {
    animation: glowPulseNoting 1.0s ease-in-out infinite;
  }

  /* ── ring-sweep — rotating conic gradient used only during 'noting'.
        Painted on a sibling layer + rotated via transform (GPU composited)
        so DWM doesn't repaint on every frame. */
  .ring-sweep {
    position: absolute;
    inset: -2px;
    border-radius: 16px;
    pointer-events: none;
    background: conic-gradient(
      from 0deg,
      rgba(var(--accent), 0) 0%,
      rgba(var(--accent), 0) 55%,
      rgba(var(--accent), 0.85) 78%,
      rgba(var(--accent), 0.10) 92%,
      rgba(var(--accent), 0) 100%
    );
    /* Punch a hole in the center so only the ring shows. */
    -webkit-mask: radial-gradient(circle, transparent 22px, black 24px);
            mask: radial-gradient(circle, transparent 22px, black 24px);
    opacity: 0;
    will-change: transform, opacity;
  }
  #stage[data-phase="noting"] .ring-sweep {
    opacity: 1;
    animation: ringSweepSpin 1.2s linear infinite;
  }

  /* ── idle sheen: extremely slow conic-gradient highlight rotating on
        a thin border-ring layer so even idle reads "alive". */
  .idle-sheen {
    position: absolute;
    inset: -1px;
    border-radius: 15px;
    pointer-events: none;
    background: conic-gradient(
      from 0deg,
      rgba(255, 255, 255, 0)    0%,
      rgba(255, 255, 255, 0)   60%,
      rgba(255, 255, 255, 0.22) 80%,
      rgba(255, 255, 255, 0)   100%
    );
    -webkit-mask: radial-gradient(circle, transparent 23px, black 24px);
            mask: radial-gradient(circle, transparent 23px, black 24px);
    opacity: 0;
    will-change: transform, opacity;
  }
  #stage[data-phase="idle"] .idle-sheen {
    opacity: 0.7;
    animation: idleSheenSpin 12s linear infinite;
  }

  /* ── the box itself ── */
  .box {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 14px;
    cursor: pointer;
    background:
      linear-gradient(135deg, rgba(48, 48, 56, 0.95) 0%, rgba(18, 18, 22, 0.95) 100%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow:
      0 6px 18px rgba(0, 0, 0, 0.45),
      0 1px 0 rgba(255, 255, 255, 0.05) inset,
      0 -6px 18px rgba(0, 0, 0, 0.35) inset;
    overflow: hidden;
    transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.25s ease,
                border-color 0.25s ease;
  }
  #stage[data-phase="listening"] .box {
    border-color: rgba(var(--accent), 0.55);
  }
  #stage[data-phase="noting"] .box {
    border-color: rgba(var(--accent), 0.40);
  }
  .box:hover {
    transform: scale(1.05);
    border-color: rgba(255, 255, 255, 0.22);
    box-shadow:
      0 8px 22px rgba(0, 0, 0, 0.55),
      0 0 18px rgba(255, 255, 255, 0.10),
      0 1px 0 rgba(255, 255, 255, 0.08) inset,
      0 -6px 18px rgba(0, 0, 0, 0.35) inset;
  }
  .box:active { transform: scale(0.97); }

  /* glass shine on top edge */
  .box::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), transparent 38%);
    pointer-events: none;
  }

  /* ambient inner dot — gives the box "life" without being busy */
  .dot {
    position: absolute;
    top: 50%; left: 50%;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(var(--accent), 0.95);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px rgba(var(--accent), 0.70);
    animation: dotBreathe 3.6s ease-in-out infinite;
  }
  #stage[data-phase="listening"] .dot { animation: dotPulseListening 0.85s ease-in-out infinite; }
  #stage[data-phase="noting"]    .dot { animation: dotShimmer 0.55s linear infinite; }
  #stage[data-phase="disconnected"] .dot {
    animation: none;
    opacity: 0.35;
    background: rgba(255, 255, 255, 0.4);
    box-shadow: none;
  }

  /* sparkles — orbiting micro-dots, visible only during 'noting' */
  .sparkles {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .sparkle {
    position: absolute;
    top: 50%; left: 50%;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: rgb(var(--accent));
    box-shadow: 0 0 6px rgba(var(--accent), 0.95);
    opacity: 0;
    transform: translate(-50%, -50%);
  }
  #stage[data-phase="noting"] .sparkle {
    animation: sparkleSpin 1.6s linear infinite;
  }

  /* ── disconnected: drain color, dim, slow heartbeat so the user knows
        the app is trying to reconnect (not just frozen). ── */
  #stage[data-phase="disconnected"] .box {
    filter: grayscale(1) brightness(0.55);
    animation: heartbeat 4s ease-in-out infinite;
  }

  /* ── wake-word offline (orthogonal to data-phase, combines with idle/etc.):
        adds a subtle red-amber tint on top of whatever phase we're in,
        so the user immediately sees the degraded state without losing the
        current phase animation. ── */
  #stage[data-wake="failed"] .glow {
    background: radial-gradient(
      closest-side,
      rgba(var(--accent-failed), 0.32) 0%,
      rgba(var(--accent-failed), 0.16) 40%,
      rgba(var(--accent-failed), 0) 78%
    );
  }
  #stage[data-wake="failed"][data-phase="idle"] .glow {
    animation: glowBreathe 5.0s ease-in-out infinite;
    opacity: 0.85;
  }
  #stage[data-wake="failed"] .dot {
    background: rgba(var(--accent-failed), 0.95);
    box-shadow: 0 0 10px rgba(var(--accent-failed), 0.65);
  }

  /* ── hover menu — two clickable rows that replace the old single tooltip ── */
  #bubble-menu {
    position: absolute;
    top: 50%;
    right: calc(var(--right-pad) + var(--box) + var(--tooltip-gap));
    transform: translateY(-50%) translateX(6px);
    padding: 6px;
    border-radius: 10px;
    background: rgba(20, 20, 24, 0.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.55);
    color: rgba(255, 255, 255, 0.92);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  #bubble-menu.visible {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
    pointer-events: auto;
  }
  #bubble-menu .row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  #bubble-menu .row:hover { background: rgba(255, 255, 255, 0.10); }
  #bubble-menu .ico { font-size: 14px; line-height: 1; }
  /* triangle pointer on the right edge */
  #bubble-menu::after {
    content: '';
    position: absolute;
    right: -5px;
    top: 50%;
    transform: translateY(-50%) rotate(45deg);
    width: 8px; height: 8px;
    background: rgba(20, 20, 24, 0.94);
    border-right: 1px solid rgba(255, 255, 255, 0.10);
    border-top: 1px solid rgba(255, 255, 255, 0.10);
  }

  /* ── keyframes ── */
  @keyframes pulseRing {
    0%   { transform: scale(1);    opacity: 0.75; }
    100% { transform: scale(1.75); opacity: 0;    }
  }
  @keyframes dotBreathe {
    0%, 100% { opacity: 0.65; transform: translate(-50%, -50%) scale(0.85); }
    50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.10); }
  }
  @keyframes dotPulseListening {
    0%, 100% { opacity: 0.80; transform: translate(-50%, -50%) scale(0.70); }
    50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.25); }
  }
  @keyframes dotShimmer {
    0%, 100% { opacity: 0.75; transform: translate(-50%, -50%) scale(1);    }
    50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.30); }
  }
  @keyframes sparkleSpin {
    0%   { opacity: 0; transform: rotate(0deg) translateX(14px) rotate(0deg) scale(0.5); }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: rotate(360deg) translateX(14px) rotate(-360deg) scale(1); }
  }
  @keyframes glowBreathe {
    0%, 100% { opacity: 0.30; transform: scale(0.92); }
    50%      { opacity: 0.65; transform: scale(1.05); }
  }
  @keyframes glowPulseListening {
    0%, 100% { opacity: 0.55; transform: scale(0.95); }
    50%      { opacity: 0.95; transform: scale(1.12); }
  }
  @keyframes glowPulseNoting {
    0%, 100% { opacity: 0.50; transform: scale(0.98); }
    50%      { opacity: 0.85; transform: scale(1.08); }
  }
  @keyframes ringSweepSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes idleSheenSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes heartbeat {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 0.85; }
  }
</style>
</head>
<body>
  <div id="bubble-menu" aria-hidden="true">
    <div class="row" data-action="file">
      <span class="ico">📁</span><span class="lbl">Change file</span>
    </div>
    <div class="row" data-action="lang">
      <span class="ico">🌐</span><span class="lbl">Change language</span>
    </div>
  </div>

  <div id="stage" data-phase="disconnected" data-wake="ok">
    <div class="glow"></div>
    <div class="idle-sheen"></div>
    <div class="halo-ring" style="animation-delay: 0s"></div>
    <div class="halo-ring" style="animation-delay: 0.7s"></div>
    <div class="halo-ring" style="animation-delay: 1.4s"></div>
    <div class="ring-sweep"></div>
    <div class="box">
      <div class="dot"></div>
      <div class="sparkles">
        <div class="sparkle" style="animation-delay: 0s"></div>
        <div class="sparkle" style="animation-delay: 0.4s"></div>
        <div class="sparkle" style="animation-delay: 0.8s"></div>
        <div class="sparkle" style="animation-delay: 1.2s"></div>
      </div>
    </div>
  </div>

<script>
  const stage = document.getElementById('stage');
  const box = stage.querySelector('.box');
  const bubbleMenu = document.getElementById('bubble-menu');
  const fileRowLabel = bubbleMenu.querySelector('.row[data-action="file"] .lbl');

  // ─── WebSocket: subscribe to status + target changes ────────────────────
  // 127.0.0.1 (not "localhost") because Python binds to 127.0.0.1 (FASTAPI_HOST
  // in config.py). On Win11 "localhost" resolves to ::1 first and would skip
  // straight past our IPv4-only server if anything else were bound to ::1:8765.
  const WS_URL = 'ws://127.0.0.1:8765/ws';
  const RECONNECT_DELAY = 3000;
  const DRAG_THRESHOLD = 4;

  const SERVER_TO_PHASE = {
    listening: 'idle',
    command: 'listening',
    processing: 'noting',
    disconnected: 'disconnected',
  };

  const chimeAudio = new Audio('./assets/siri-listening.mp3');
  chimeAudio.preload = 'auto';
  chimeAudio.volume = 0.8;

  function playChime() {
    try {
      chimeAudio.currentTime = 0;
      chimeAudio.play().catch(() => {});
    } catch {}
  }

  let ws = null;
  let reconnectTimer = null;
  let prevServerState = null;
  // Default tooltip — flips to the wake-word warning if Python tells us the
  // listener died at startup. Kept in JS so the warning can include the
  // actual error in a title attribute for hover-inspection.
  const TOOLTIP_DEFAULT = 'Change file';
  const TOOLTIP_WAKE_OFFLINE = 'Wake word offline · Ctrl+Shift+N';

  function setStatus(serverState) {
    const phase = SERVER_TO_PHASE[serverState] || 'disconnected';
    stage.setAttribute('data-phase', phase);

    if (serverState !== prevServerState) {
      if (serverState === 'command' || serverState === 'processing') {
        playChime();
      } else if (serverState === 'listening' && prevServerState === 'processing') {
        playChime();
      }
    }
    prevServerState = serverState;
  }

  function setWakeWordState(status, error) {
    // "listening" is the only healthy state Python reports for the wake-word
    // thread. Anything else — failed, initializing-and-stuck, not_started —
    // means the user can't say "Hey Deen" and needs to know.
    const ok = status === 'listening';
    stage.setAttribute('data-wake', ok ? 'ok' : 'failed');
    // The "Change file" row in the hover menu doubles as a wake-word health
    // hint when the listener is down — keeps surface area minimal.
    if (fileRowLabel) {
      fileRowLabel.textContent = ok ? TOOLTIP_DEFAULT : TOOLTIP_WAKE_OFFLINE;
    }
    if (!ok && error) {
      bubbleMenu.title = error;  // hover for full error text
    } else {
      bubbleMenu.removeAttribute('title');
    }
  }

  function connect() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

    try {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => { setStatus('listening'); };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'status') {
            setStatus(msg.status);
          } else if (msg.type === 'wake_word_state') {
            setWakeWordState(msg.status, msg.error);
          }
          // Other messages (target, note, note_updated) are ignored here —
          // the picker reads /target on open, so the bubble doesn't need
          // to render filename state anywhere.
        } catch {}
      };

      ws.onclose = () => {
        setStatus('disconnected');
        ws = null;
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, RECONNECT_DELAY);
      };

      ws.onerror = () => { ws.close(); };
    } catch {
      setStatus('disconnected');
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, RECONNECT_DELAY);
    }
  }

  // ─── Click-through: forward mousemove keeps firing while transparent,
  //     and we only "claim" mouse events when the cursor enters the box
  //     rectangle OR the menu. Everything outside both stays click-through.
  let interactive = false;
  function pointInRect(x, y, rect) {
    return x >= rect.left && x <= rect.right &&
           y >= rect.top  && y <= rect.bottom;
  }
  function updateInteractive(e) {
    if (isDragging) return;
    const boxRect = box.getBoundingClientRect();
    const menuRect = bubbleMenu.getBoundingClientRect();
    const inBox  = pointInRect(e.clientX, e.clientY, boxRect);
    // Menu rect is only meaningful when the menu is visible — when hidden
    // its bounding rect is still valid but we ignore it so a hover in the
    // void to the left of the bubble doesn't unintentionally claim input.
    const menuVisible = bubbleMenu.classList.contains('visible');
    const inMenu = menuVisible && pointInRect(e.clientX, e.clientY, menuRect);
    const inside = inBox || inMenu;
    if (inside !== interactive) {
      interactive = inside;
      window.bubbleAPI?.setInteractive(inside);
    }
    // Show menu whenever cursor is on the box. Keep it shown while inside
    // the menu too. Hide once cursor leaves both.
    if (inBox || inMenu) {
      bubbleMenu.classList.add('visible');
    } else {
      bubbleMenu.classList.remove('visible');
    }
  }
  document.addEventListener('mousemove', updateInteractive);

  // ─── Drag + click ────────────────────────────────────────────────────
  let isDragging = false;
  let dragStartX = 0;
  let dragStartY = 0;
  let hasMoved = false;

  box.addEventListener('mousedown', (e) => {
    if (e.button === 2) return;
    isDragging = true;
    hasMoved = false;
    dragStartX = e.screenX;
    dragStartY = e.screenY;
    e.preventDefault();
  });

  // Right-click anywhere on the box opens the main notes window.
  box.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    window.bubbleAPI?.showMainWindow();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.screenX - dragStartX;
    const dy = e.screenY - dragStartY;
    if (!hasMoved && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
      hasMoved = true;
    }
    if (hasMoved) {
      window.bubbleAPI?.moveBubble(dx, dy);
      dragStartX = e.screenX;
      dragStartY = e.screenY;
    }
  });

  // Menu rows: clicking either row routes to the appropriate picker.
  // Bound directly on the rows (not delegated through the box's mouseup)
  // because the row click happens entirely inside #bubble-menu, separate
  // from the box's drag-vs-click state machine below.
  bubbleMenu.querySelectorAll('.row').forEach((row) => {
    row.addEventListener('click', () => {
      const action = row.getAttribute('data-action');
      bubbleMenu.classList.remove('visible');
      if (action === 'lang')      window.bubbleAPI?.openLangPicker();
      else                         window.bubbleAPI?.openPicker();
    });
  });

  document.addEventListener('mouseup', (e) => {
    if (!isDragging) return;
    isDragging = false;
    // Plain click on the box (NOT on a menu row) opens the file picker —
    // preserves the muscle memory from before the hover menu existed.
    if (!hasMoved && e.button === 0) {
      const onMenu = e.target.closest && e.target.closest('#bubble-menu');
      if (!onMenu) {
        bubbleMenu.classList.remove('visible');
        window.bubbleAPI?.openPicker();
      }
    }
  });

  connect();
</script>
</body>
</html>
